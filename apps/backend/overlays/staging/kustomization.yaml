apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- namespace.yaml
- ../../base

images:
- name: 647604014014.dkr.ecr.eu-west-1.amazonaws.com/terasky-demo/backend
  newTag: sha-fde30ff

configMapGenerator:
- behavior: merge
  literals:
  - APP_ENV=staging
  - LOG_LEVEL=INFO
  name: backend-config

  # Staging mirrors production shape at reduced scale (base values: HPA 2-4,
  # PDB minAvailable 1, base resources) - only hostname/secret path change.
patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: terasky-backend-node-reader-staging
  target:
    kind: ClusterRole
    name: terasky-backend-node-reader
- patch: |-
    - op: replace
      path: /metadata/name
      value: terasky-backend-node-reader-staging
    - op: replace
      path: /roleRef/name
      value: terasky-backend-node-reader-staging
  target:
    kind: ClusterRoleBinding
    name: terasky-backend-node-reader
- patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: backend.staging.terasky-demo.example.com
  target:
    kind: Ingress
    name: backend
- patch: |-
    - op: replace
      path: /spec/data/0/remoteRef/key
      value: terasky/staging/backend
  target:
    kind: ExternalSecret
    name: backend
- patch: |-
    - op: replace
      path: /metadata/annotations/eks.amazonaws.com~1role-arn
      value: arn:aws:iam::647604014014:role/terasky-demo-eso-staging
  target:
    kind: ServiceAccount
    name: eso-backend
