# Namespaced SecretStore (NOT a ClusterSecretStore): each environment's store
# authenticates via IRSA with the eso-backend ServiceAccount of ITS OWN
# namespace, whose IAM role can read only that environment's secret path.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: terasky-backend
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-backend
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: terasky-backend
spec:
  refreshInterval: 1h # dev shortens this for the rotation demo
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: terasky/dev/backend # patched per environment
        property: apiKey
