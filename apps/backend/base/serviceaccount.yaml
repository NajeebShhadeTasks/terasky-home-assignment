apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: terasky-backend
# The app needs the Kubernetes API (GET /nodes), so the token IS mounted -
# explicitly, as documentation of intent. The account's power is limited to
# get/list nodes by the ClusterRole in rbac.yaml.
automountServiceAccountToken: true
---
# Identity used by the External Secrets SecretStore in this namespace.
# The eks.amazonaws.com/role-arn annotation is patched per environment so each
# namespace can assume ONLY its own IAM role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-backend
  labels:
    app.kubernetes.io/name: terasky-backend
  annotations:
    eks.amazonaws.com/role-arn: OVERRIDDEN-PER-ENVIRONMENT
automountServiceAccountToken: false
