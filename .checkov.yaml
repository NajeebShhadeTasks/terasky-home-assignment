# Checkov configuration - Terraform scanning.
#
# Every skip below is a DELIBERATE, documented demo trade-off, not a silenced
# finding. The production design (docs/aws-production-design.md) addresses all
# of them.
directory:
  - infra/terraform
framework:
  - terraform
compact: true
quiet: true
download-external-modules: false
skip-check:
  # Demo trade-off: public EKS API endpoint so the assignment can be driven
  # from a laptop. Production: private endpoint + bastion/VPN.
  - CKV_AWS_38  # EKS public endpoint access
  - CKV_AWS_39  # EKS public endpoint enabled
  # Demo trade-off: only api/audit/authenticator control-plane logs are kept
  # (scheduler/controllerManager add cost, little demo value).
  - CKV_AWS_37  # EKS control plane logging for ALL log types
  # Module default launch template uses IMDS hop limit 2 (needed by some
  # container workloads for IMDSv2); production would pin hop limit 1 via a
  # custom launch template.
  - CKV_AWS_341
  # Secrets Manager CMK: demo uses the AWS-managed key; production would use a
  # customer-managed KMS key.
  - CKV_AWS_149
  # Rotation is manual for the demo (put-secret-value + ESO refresh);
  # production uses Secrets Manager rotation - see docs/secrets.md.
  - CKV2_AWS_57
  # ECR: AES256 (SSE-S3 style) encryption is acceptable for demo images;
  # production recommendation is a CMK.
  - CKV_AWS_136
  # VPC flow logs: cost trade-off for the demo, recommended in production.
  - CKV2_AWS_11
