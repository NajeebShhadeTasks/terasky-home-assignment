# Policy engine. DEMO sizing: single replica per controller (production runs
# 3 admission-controller replicas for HA - with Fail-closed webhooks, a dead
# single replica blocks deployments to the policied namespaces).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: kyverno
      version: 3.9.0
      sourceRef:
        kind: HelmRepository
        name: kyverno
  values:
    admissionController:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
    backgroundController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    cleanupController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    reportsController:
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
