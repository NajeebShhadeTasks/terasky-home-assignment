apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: terasky-policy-tests
policies:
  - ../kyverno/require-run-as-non-root.yaml
  - ../kyverno/disallow-privilege-escalation.yaml
  - ../kyverno/require-resources.yaml
  - ../kyverno/require-probes.yaml
  - ../kyverno/disallow-latest-tag.yaml
  - ../kyverno/restrict-image-registries.yaml
resources:
  - resources/good-pod.yaml
  - resources/bad-pod.yaml
  - resources/bad-pod-untagged.yaml
results:
  # --- compliant pod passes everything -------------------------------------
  - policy: require-run-as-non-root
    rule: run-as-non-root
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: disallow-privilege-escalation
    rule: deny-privileged
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: disallow-privilege-escalation
    rule: deny-privilege-escalation
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: require-resources
    rule: require-requests-and-limits
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: require-probes
    rule: require-liveness-readiness
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: disallow-latest
    resources: [good-backend]
    kind: Pod
    result: pass
  - policy: restrict-image-registries
    rule: ecr-only
    resources: [good-backend]
    kind: Pod
    result: pass
  # --- non-compliant pod fails everything ----------------------------------
  - policy: require-run-as-non-root
    rule: run-as-non-root
    resources: [bad-backend]
    kind: Pod
    result: fail
  - policy: disallow-privilege-escalation
    rule: deny-privileged
    resources: [bad-backend]
    kind: Pod
    result: fail
  - policy: disallow-privilege-escalation
    rule: deny-privilege-escalation
    resources: [bad-backend]
    kind: Pod
    result: fail
  - policy: require-resources
    rule: require-requests-and-limits
    resources: [bad-backend]
    kind: Pod
    result: fail
  - policy: require-probes
    rule: require-liveness-readiness
    resources: [bad-backend]
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    rule: disallow-latest
    resources: [bad-backend]
    kind: Pod
    result: fail
  - policy: restrict-image-registries
    rule: ecr-only
    resources: [bad-backend]
    kind: Pod
    result: fail
  # --- untagged image (implicit latest) ------------------------------------
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources: [bad-backend-untagged]
    kind: Pod
    result: fail
