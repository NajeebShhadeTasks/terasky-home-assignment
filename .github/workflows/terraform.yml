name: Terraform

# Plan on infra PRs (read-only credentials via OIDC), apply only through
# workflow_dispatch gated by the `production` environment approval.

on:
  pull_request:
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::647604014014:role/terasky-demo-gha-terraform
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: terraform plan
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    # Fork PRs cannot mint OIDC tokens; skip rather than fail confusingly.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.5.7"
      - name: Authenticate to AWS (OIDC)
        if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init + plan
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color | tail -50 >> "$GITHUB_STEP_SUMMARY" || {
            echo "Plan failed"; exit 1; }

  apply:
    name: terraform apply (approval required)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Human approval gate before AWS-mutating credentials are issued.
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.5.7"
      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init + apply
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
